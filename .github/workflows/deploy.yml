name: Deploy to GitHub Pages

# The repository's Pages source is "deploy from branch", which republishes the raw
# repo (README) on every push via GitHub's own "pages build and deployment" run.
# The deploy job below waits for that run to finish so the built site is always the
# last deployment and wins. Switching Pages to "GitHub Actions" in Settings removes
# the need for the wait.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Report Pages source
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/${{ github.repository }}/pages" --jq '"build_type=\(.build_type) url=\(.html_url)"' || true
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - run: npm ci
      - name: Build static export
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.origin }}${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Wait for the branch Pages build to finish
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 30); do
            busy=$(gh run list -R "${{ github.repository }}" --workflow "pages build and deployment" --status in_progress --json databaseId --jq 'length' 2>/dev/null || echo 0)
            queued=$(gh run list -R "${{ github.repository }}" --workflow "pages build and deployment" --status queued --json databaseId --jq 'length' 2>/dev/null || echo 0)
            if [ "$busy" = "0" ] && [ "$queued" = "0" ]; then echo "Branch build finished"; break; fi
            echo "Branch build still running, waiting"; sleep 10
          done
          sleep 20
      - id: deployment
        uses: actions/deploy-pages@v4
